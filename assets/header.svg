<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="bambu-cli header">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#141414" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#F4F1EA" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />
  <rect x="16" y="16" width="1168" height="288" rx="12" fill="none" stroke="#141414" stroke-width="2.5" />

  <!-- Top rule -->
  <line x1="44" y1="62" x2="1156" y2="62" stroke="#141414" stroke-width="1.5" />
  <text x="48" y="47" font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" font-weight="700" fill="#141414" letter-spacing="1.5">SUNWOOD AI LABS // HARDWARE AUTOMATION CLI</text>

  <!-- Right top pills -->
  <rect x="854" y="29" width="144" height="24" rx="4" fill="#141414" />
  <text x="926" y="45" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#F4F1EA">FTPS 990 + MQTT</text>
  <rect x="1010" y="29" width="142" height="24" rx="4" fill="#0E7C5B" />
  <text x="1081" y="45" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#FFFFFF">LAN ONLY MODE</text>

  <!-- Left icon mark -->
  <g transform="translate(56, 98)">
    <rect x="0" y="0" width="128" height="128" rx="24" fill="#141414" stroke="#0E7C5B" stroke-width="4" />
    <rect x="24" y="24" width="80" height="8" rx="4" fill="#F4F1EA" />
    <rect x="52" y="30" width="24" height="18" rx="4" fill="#0E7C5B" />
    <polygon points="58,48 70,48 64,60" fill="#D95F02" />
    <rect x="38" y="68" width="52" height="8" rx="3" fill="#F4F1EA" />
    <rect x="32" y="80" width="64" height="8" rx="3" fill="#0E7C5B" />
    <rect x="22" y="94" width="84" height="8" rx="4" fill="#D95F02" />
  </g>

  <!-- Main title & subtitle -->
  <text x="220" y="152" font-family="'Segoe UI', system-ui, sans-serif" font-size="60" font-weight="900" fill="#141414" letter-spacing="-1">bambu-cli</text>
  <text x="220" y="192" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#2C2C2C">Headless Bambu Studio Slicing &amp; LAN FTPS / MQTT Print Control</text>

  <!-- Feature chips -->
  <rect x="220" y="216" width="176" height="32" rx="6" fill="#FFFDF8" stroke="#141414" stroke-width="1.5" />
  <text x="308" y="237" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#141414">01 HEADLESS SLICE</text>

  <rect x="410" y="216" width="176" height="32" rx="6" fill="#FFFDF8" stroke="#141414" stroke-width="1.5" />
  <text x="498" y="237" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1F5AA6">02 FTPS TRANSFER</text>

  <rect x="600" y="216" width="194" height="32" rx="6" fill="#FFFDF8" stroke="#141414" stroke-width="1.5" />
  <text x="697" y="237" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#0E7C5B">03 MQTT TELEMETRY</text>

  <rect x="808" y="216" width="188" height="32" rx="6" fill="#141414" />
  <text x="902" y="237" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#F5B041">AI AGENT READY</text>

  <!-- Bottom rule -->
  <line x1="44" y1="274" x2="1156" y2="274" stroke="#141414" stroke-width="1.5" />
  <text x="48" y="294" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#555555">PYTHON 3.10+ · BAMBULABS-API · WINDOWS / MACOS / LINUX</text>
  <text x="1152" y="294" text-anchor="end" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#D95F02">MIT LICENSE</text>
